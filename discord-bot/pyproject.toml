[project]
name = "personal-dashboard-discord-bot"
version = "0.1.0"
description = "Discord notifications for the personal project dashboard"
requires-python = ">=3.12,<3.13"
dependencies = [
    "discord.py>=2.4,<3.0",
    "httpx>=0.27,<1.0",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["tests"]
pythonpath = ["."]
