upstream dashboard_api {
    server api:8000;
    keepalive 16;
}

upstream dashboard_web {
    server web:80;
    keepalive 8;
}

# ブラウザのようにAuthorizationが無いリクエストだけwebスコープのキーを補う。
# pipeline/MCP等が明示したAuthorizationは上書きしない。
map $http_authorization $dashboard_api_authorization {
    default $http_authorization;
    ""      "Api-Key ${DASHBOARD_WEB_API_KEY}";
}

map $http_upgrade $dashboard_connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 80;
    server_name localhost 127.0.0.1;
    server_tokens off;
    charset utf-8;
    client_max_body_size 2m;

    location /mcp {
        proxy_pass http://dashboard_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://dashboard_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $dashboard_api_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        proxy_pass http://dashboard_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location = /admin {
        return 301 /admin/;
    }

    location /static/ {
        proxy_pass http://dashboard_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://dashboard_web;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dashboard_connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
