[project]
name = "personal-dashboard-api"
version = "0.1.0"
description = "Backend foundation for the personal project dashboard"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django>=5.1,<6.0",
    "django-cors-headers>=4.4,<5.0",
    "djangorestframework>=3.15,<4.0",
    "drf-spectacular>=0.27,<1.0",
    "gunicorn>=23.0,<24.0",
    "mcp>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-json-logger>=3.2,<5.0",
    "whitenoise>=6.8,<7.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-django>=4.9,<5.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
